# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "keylint"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "AI-powered clipboard text fixer"
vendor: "KeyLint"
homepage: "https://keylint.io"
license: "MIT + Commons Clause"
release: "1"

contents:
  - src: "./bin/keylint"
    dst: "/usr/local/bin/keylint"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/keylint.png"
  - src: "./build/linux/keylint.desktop"
    dst: "/usr/share/applications/keylint.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack, which Wails v3
# builds against by default since alpha.93 (Ubuntu 24.04+ / Debian 13+).
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

