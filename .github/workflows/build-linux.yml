name: Build

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. One job writes: publish-dev-build, which gets
# contents: write for the dev-channel prereleases (see the trust model there).
permissions:
  contents: read

# A newer push supersedes an in-flight PR run; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # What this run builds, decided once and read by the build jobs and the
    # dev-channel publisher, so the version stamped into the binary, the tag
    # it is published under and the commit it is built from cannot disagree.
    outputs:
      publish: ${{ steps.name.outputs.publish }}
      tag: ${{ steps.name.outputs.tag }}
      sha: ${{ steps.name.outputs.sha }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Dev-channel builds (same-repo PRs that are not Dependabot's, and pushes
      # to main) are stamped 0.0.0-pr.<N>+<sha> / 0.0.0-main+<sha>: version
      # 0.0.0 is what keeps every client, old ones included, from offering them
      # as an update (internal/features/updater/devbuild_safety_test.go). Every
      # other build keeps `git describe`, minus the dev tags, which would
      # otherwise be the nearest tag and turn a CI build into "v0.0.0-main-3-g…".
      - name: Name this build
        id: name
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          publish=false tag= sha=
          if [[ "$EVENT" == pull_request && "$HEAD_REPO" == "$REPO" && "$PR_AUTHOR" != 'dependabot[bot]' ]]; then
            publish=true tag="v0.0.0-pr.${PR_NUMBER}" sha="$HEAD_SHA"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main ]]; then
            publish=true tag=v0.0.0-main sha="$PUSH_SHA"
          fi
          if [[ "$publish" == true ]]; then
            version="${tag#v}+${sha:0:7}"
          else
            version=$(git describe --tags --always --dirty --exclude 'v0.0.0-*' 2>/dev/null || echo dev)
          fi
          echo "publish=$publish tag=$tag sha=$sha version=$version"
          {
            echo "publish=$publish"
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # cache-apt-pkgs never refreshes the package lists on GitHub runners (it only
      # does under `act`), so stale lists 404 on a cache miss — and the action then
      # caches the empty result. Keep this step.
      - name: Refresh apt package lists
        run: sudo apt-get update -o Acquire::Retries=3

      - name: Install system deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev gcc
          version: "1.1"

      # The action above caches whatever it managed to install, including nothing
      # (version 1.0 was cached empty on 2026-10-04). Fail here, at the cause. The save
      # already happened inside the action, so this does not stop a broken cache from
      # being restored next time: recover by bumping `version` above (or deleting the
      # cache with `gh cache delete <id>`).
      - name: Check GTK3 headers are present
        run: pkg-config --exists --print-errors gtk+-3.0 webkit2gtk-4.1

      - name: Install Wails v3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # -race, because the concurrency this app has is real: Wails serves every
      # RPC on its own goroutine, so settings writes and provider listings run
      # at the same time. Two such races have already shipped; the detector only
      # sees them on a run like this one.
      - name: Run Go tests
        run: go test -race -tags gtk3 ./internal/...

      # The eval suites are behind `//go:build eval`, so `go test` never
      # compiles them and a rename in the code they measure breaks nothing
      # visible until someone spends an API call to find out. Vet compiles them
      # without running them. Scoped to ./internal/... because the root package
      # embeds frontend/dist, which makes it depend on a build step rather than
      # on the Go code this is checking.
      - name: Check the eval-tagged code still compiles
        run: go vet -tags eval,gtk3 ./internal/...

      # Every exported method of a registered service becomes callable from the
      # webview. The generated bindings are committed, so a new exported method
      # widens that surface while the committed file still shows the old one.
      - name: Check generated bindings are current
        run: |
          wails3 generate bindings -f '-tags gtk3'
          # status, not diff: a newly registered service produces new, untracked
          # files, which `git diff` does not see.
          if [ -n "$(git status --porcelain frontend/bindings)" ]; then
            git status --porcelain frontend/bindings
            echo "::error::frontend/bindings is stale. Run 'wails3 generate bindings' and commit, or unexport the new method."
            exit 1
          fi

  # Playwright runs against `ng serve` only — no Go, no Wails, no system deps.
  # It still waits for `test` so a runner is not spent on UI checks while the
  # unit tests are already red; nothing in this job depends on that one's work.
  # Kept out of the build jobs' dependency chain on purpose: a UI regression
  # should fail the PR, but it should not stop the binaries from being produced.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Playwright config reads this to stop reusing a stale dev server and
      # to allow a cold `ng serve` more startup time. Actions sets it too; being
      # explicit keeps the behaviour the same under other runners.
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Only the browser download is cached; --with-deps still installs the apt
      # libraries each run, which is why the install step always runs.
      #
      # restore/save rather than actions/cache: the combined action only saves on
      # a successful job, so a red e2e run — the one this job exists for — would
      # re-download Chromium on every push. restore-keys covers the common case
      # where an unrelated dependency bump changed the lockfile hash but not the
      # browser; `playwright install` then skips what is already on disk.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Save Playwright browsers
        # Not always(): a cancelled job can leave a half-downloaded browser
        # directory, which would then be cached under a key that looks valid.
        if: ${{ !cancelled() && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # The whole suite, so a new spec cannot be silently left out of CI.
      # silent-fix.spec.ts needs a real ANTHROPIC_API_KEY, which a fork PR cannot
      # have; it is `test.describe.skip` in the file itself and reports as
      # skipped. Everything that does run here runs on a fork unchanged.
      - name: Run Playwright specs
        working-directory: frontend
        run: npx playwright test

      # The HTML report already embeds the screenshots and traces, deduplicated,
      # so test-results/ would only triple the artifact. `cancelled()` matters
      # because a hung e2e job is exactly when the report is worth having.
      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 3
          if-no-files-found: ignore

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A dev-channel build is made from the PR's head commit — the one its
          # tag and version name — not the merge commit a PR run checks out by
          # default. Empty for every other build, which keeps the default.
          ref: ${{ needs.test.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # cache-apt-pkgs never refreshes the package lists on GitHub runners (it only
      # does under `act`), so stale lists 404 on a cache miss — and the action then
      # caches the empty result. Keep this step.
      - name: Refresh apt package lists
        run: sudo apt-get update -o Acquire::Retries=3

      - name: Install system deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev gcc
          version: "1.1"

      # The action above caches whatever it managed to install, including nothing
      # (version 1.0 was cached empty on 2026-10-04). Fail here, at the cause. The save
      # already happened inside the action, so this does not stop a broken cache from
      # being restored next time: recover by bumping `version` above (or deleting the
      # cache with `gh cache delete <id>`).
      - name: Check GTK3 headers are present
        run: pkg-config --exists --print-errors gtk+-3.0 webkit2gtk-4.1

      - name: Install Wails v3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Linux binary
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          export PATH=$PATH:$HOME/go/bin
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags production,gtk3 -trimpath -ldflags="-w -s -X main.AppVersion=${VERSION}" -o bin/KeyLint .

      # The gtk3 tag is the only thing keeping Linux off GTK4 + WebKitGTK 6.0,
      # which aborts at start on stock Ubuntu 23.10+. Fail if it ever slips.
      - name: Check the Linux binary links GTK3
        run: |
          needed=$(readelf -d bin/KeyLint | grep NEEDED)
          case "$needed" in *libgtk-3.so*) ;; *) bad=1;; esac
          case "$needed" in *libwebkit2gtk-4.1.so*) ;; *) bad=1;; esac
          if [ -n "${bad:-}" ]; then
            echo "$needed"
            echo "::error::bin/KeyLint does not link GTK3 / WebKit2GTK 4.1 - was -tags gtk3 dropped?"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KeyLint-linux-amd64
          path: bin/KeyLint
          retention-days: 3

  build-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # A dev-channel build is made from the PR's head commit — the one its
          # tag and version name — not the merge commit a PR run checks out by
          # default. Empty for every other build, which keeps the default.
          ref: ${{ needs.test.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # cache-apt-pkgs never refreshes the package lists on GitHub runners (it only
      # does under `act`), so stale lists 404 on a cache miss — and the action then
      # caches the empty result. Keep this step.
      - name: Refresh apt package lists
        run: sudo apt-get update -o Acquire::Retries=3

      - name: Install system deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev gcc gcc-mingw-w64
          version: "1.1"

      # The action above caches whatever it managed to install, including nothing
      # (version 1.0 was cached empty on 2026-10-04). Fail here, at the cause. The save
      # already happened inside the action, so this does not stop a broken cache from
      # being restored next time: recover by bumping `version` above (or deleting the
      # cache with `gh cache delete <id>`).
      - name: Check GTK3 headers are present
        run: pkg-config --exists --print-errors gtk+-3.0 webkit2gtk-4.1

      - name: Install Wails v3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Windows resource file
        run: |
          export PATH=$PATH:$HOME/go/bin
          wails3 generate syso \
            -arch amd64 \
            -icon build/windows/icon.ico \
            -manifest build/windows/wails.exe.manifest \
            -info build/windows/info.json \
            -out wails_windows_amd64.syso

      - name: Build Windows binary
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          export PATH=$PATH:$HOME/go/bin
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc \
            go build -tags production -trimpath \
            -ldflags="-w -s -H windowsgui -X main.AppVersion=${VERSION}" \
            -o bin/KeyLint.exe .
      - name: Install NSIS
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: nsis
          version: "1.1"

      # The bootstrapper is bundled into the installer end users run, so it is
      # fetched through a script that refuses anything not signed by Microsoft.
      # See .claude/docs/versioning.md.
      - name: Install signature tooling
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: osslsigncode
          version: "1.0"

      - name: Download and verify the WebView2 bootstrapper
        run: ./scripts/fetch-webview2.sh

      - name: Build NSIS installer
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          makensis -DARG_WAILS_AMD64_BINARY=../../../bin/KeyLint.exe \
            -DINFO_PRODUCTVERSION="${VERSION#v}" \
            build/windows/nsis/project.nsi

      # 14 days, not 3: these are what gets smoke-tested on a real Windows
      # machine, and that test rarely happens the same week as the push.
      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: KeyLint-windows-amd64
          path: bin/KeyLint.exe
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: KeyLint-windows-amd64-setup
          path: bin/KeyLint-amd64-installer.exe
          retention-days: 14

  # The dev channel: installable builds of open pull requests and of main,
  # listed in the app under Settings › About once the developer options are
  # unlocked. Published as GitHub prereleases because a release asset downloads
  # without a login and a workflow artifact does not.
  #
  #   v0.0.0-pr.<N>  one per open same-repo PR, replaced on every push,
  #                  deleted when the PR closes (dev-channel-cleanup.yml)
  #   v0.0.0-main    the latest push to main, tag moved to each new commit
  #
  # Trust model. This is the only job in the workflow with a write token, and
  # it runs no code from the repository: it downloads the two build artifacts
  # and calls `gh`. It runs only for branches of this repository — whoever can
  # push one can already write to the repo, which today is the owner — and
  # never for Dependabot. Fork PRs never get here, and GitHub would not give a
  # fork's run a write token if they did. The PR title reaches the shell only
  # through an environment variable, never through an expression in the script.
  #
  # What is published is built from the PR's head commit, while `test` and
  # `e2e` above run on the merge ref: the same code unless main has moved on
  # in a way that conflicts. The published binary itself is not tested here.
  #
  # Releases created with GITHUB_TOKEN start no workflows, so these tags do not
  # trigger release.yml; it also excludes v0.0.0-* on its own.
  publish-dev-build:
    # e2e too: a build that failed E2E must never become what "Install main
    # build" or a PR row installs.
    needs: [test, e2e, build-linux, build-windows]
    if: needs.test.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create, edit and delete the prerelease and its tag
      pull-requests: read  # ask whether the PR is still open at its head
    # Shared with dev-channel-cleanup.yml, so a close waits for a publish in
    # flight rather than racing it.
    concurrency:
      # run_id only when skipped, so skipped runs never share an empty group.
      group: dev-build-${{ needs.test.outputs.tag || github.run_id }}
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.test.outputs.tag }}
      SHA: ${{ needs.test.outputs.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: KeyLint-windows-amd64-setup
          path: dist/

      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: KeyLint-linux-amd64
          path: dist/

      # The release body is read back by the app (updater.devBuildFrom): keep
      # the "Title:", "PR:" and "Commit:" lines as they are.
      - name: Publish the prerelease
        # The write token goes to this step only, not to the artifact
        # downloads above.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_URL="https://github.com/$GH_REPO/releases/latest"

          # Never publish over newer work: main may have moved on, or the PR
          # may have been pushed to or closed while this run was building. A
          # release published after the cleanup ran would never be deleted.
          if [[ "$TAG" == v0.0.0-main ]]; then
            head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            if [[ "$head" != "$SHA" ]]; then
              echo "main is at $head now, not $SHA; leaving the newer run to publish"
              exit 0
            fi
            title="main (latest)"
            {
              echo "**Unreviewed test build of main — not for general use. Stable releases: $LATEST_URL**"
              echo
              echo "Rolling build of main, made by CI. Not a release: it is replaced on every push to main."
              echo
              echo "Commit: $SHA"
            } > notes.md
          else
            state=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state + " " + .head.sha')
            if [[ "$state" != "open $SHA" ]]; then
              echo "PR #$PR_NUMBER is now '$state', not 'open $SHA'; not publishing"
              exit 0
            fi
            title="PR #$PR_NUMBER: $PR_TITLE"
            {
              echo "**Unreviewed test build for PR #$PR_NUMBER — not for general use. Stable releases: $LATEST_URL**"
              echo
              echo "Test build of #$PR_NUMBER, made by CI. Not a release: it is replaced on every push and deleted when the pull request closes."
              echo
              echo "Title: $PR_TITLE"
              echo "PR: $PR_URL"
              echo "Commit: $SHA"
            } > notes.md
          fi

          # Same asset names as a real release, so the app's asset matcher
          # (windows-amd64-setup, linux-amd64) finds them.
          mv dist/KeyLint-amd64-installer.exe "dist/KeyLint-${TAG}-windows-amd64-setup.exe"
          mv dist/KeyLint "dist/KeyLint-${TAG}-linux-amd64"
          chmod +x "dist/KeyLint-${TAG}-linux-amd64"
          assets=("dist/KeyLint-${TAG}-windows-amd64-setup.exe" "dist/KeyLint-${TAG}-linux-amd64")

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Replace in place rather than delete and recreate: an installed
            # build of this PR must never see its release missing, or it would
            # offer to leave a PR that is still open. Files first, the
            # "Commit:" line last: a run cancelled in between leaves new files
            # under the old commit, which the next run corrects, rather than a
            # commit line naming files that are not there.
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true >/dev/null \
              || gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" "${assets[@]}" --target "$SHA" --title "$title" \
              --notes-file notes.md --prerelease --latest=false
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name + "  " + .url)'

          # Cap the PR builds at MAX_PR_BUILDS, deleting the lowest PR numbers
          # first; v0.0.0-main and the build just published are never touched.
          # Why: clients up to v4.4.3-beta read only the first 20 releases, and
          # dev prereleases sort above real ones, so too many of them would
          # hide a real release from those clients. A PR whose build is cut
          # here gets a new one on its next push; until then its installed
          # build reads as orphaned and offers main or the latest release.
          MAX_PR_BUILDS=10
          mapfile -t pr_tags < <(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[].tag_name' \
            | { grep -E '^v0\.0\.0-pr\.[0-9]+$' || true; } | sort -t. -k4,4n)
          excess=$(( ${#pr_tags[@]} - MAX_PR_BUILDS ))
          for old in "${pr_tags[@]}"; do
            (( excess > 0 )) || break
            [[ "$old" == "$TAG" ]] && continue
            gh release delete "$old" --cleanup-tag --yes
            echo "cap: deleted $old (over $MAX_PR_BUILDS PR builds)"
            excess=$(( excess - 1 ))
          done
