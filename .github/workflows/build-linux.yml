name: Build

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push supersedes an in-flight PR run; pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # cache-apt-pkgs never refreshes the package lists on GitHub runners, and
      # the image's lists go stale: on a cache miss apt then 404s on superseded
      # debs, the action carries on, and caches an empty result under the final
      # key. Refreshing first costs a few seconds and keeps the cache honest.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Install system deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev gcc
          version: 1.0

      # The action above caches whatever it managed to install, including nothing.
      # Fail here, at the cause, rather than later at the first cgo package.
      - name: Check GTK3 headers are present
        run: pkg-config --exists --print-errors gtk+-3.0 webkit2gtk-4.1

      - name: Install Wails v3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # -race, because the concurrency this app has is real: Wails serves every
      # RPC on its own goroutine, so settings writes and provider listings run
      # at the same time. Two such races have already shipped; the detector only
      # sees them on a run like this one.
      - name: Run Go tests
        run: go test -race -tags gtk3 ./internal/...

      # The eval suites are behind `//go:build eval`, so `go test` never
      # compiles them and a rename in the code they measure breaks nothing
      # visible until someone spends an API call to find out. Vet compiles them
      # without running them. Scoped to ./internal/... because the root package
      # embeds frontend/dist, which makes it depend on a build step rather than
      # on the Go code this is checking.
      - name: Check the eval-tagged code still compiles
        run: go vet -tags eval,gtk3 ./internal/...

      # Every exported method of a registered service becomes callable from the
      # webview. The generated bindings are committed, so a new exported method
      # widens that surface while the committed file still shows the old one.
      - name: Check generated bindings are current
        run: |
          wails3 generate bindings -f '-tags gtk3'
          # status, not diff: a newly registered service produces new, untracked
          # files, which `git diff` does not see.
          if [ -n "$(git status --porcelain frontend/bindings)" ]; then
            git status --porcelain frontend/bindings
            echo "::error::frontend/bindings is stale. Run 'wails3 generate bindings' and commit, or unexport the new method."
            exit 1
          fi

  # Playwright runs against `ng serve` only — no Go, no Wails, no system deps.
  # It still waits for `test` so a runner is not spent on UI checks while the
  # unit tests are already red; nothing in this job depends on that one's work.
  # Kept out of the build jobs' dependency chain on purpose: a UI regression
  # should fail the PR, but it should not stop the binaries from being produced.
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The Playwright config reads this to stop reusing a stale dev server and
      # to allow a cold `ng serve` more startup time. Actions sets it too; being
      # explicit keeps the behaviour the same under other runners.
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Only the browser download is cached; --with-deps still installs the apt
      # libraries each run, which is why the install step always runs.
      #
      # restore/save rather than actions/cache: the combined action only saves on
      # a successful job, so a red e2e run — the one this job exists for — would
      # re-download Chromium on every push. restore-keys covers the common case
      # where an unrelated dependency bump changed the lockfile hash but not the
      # browser; `playwright install` then skips what is already on disk.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Save Playwright browsers
        # Not always(): a cancelled job can leave a half-downloaded browser
        # directory, which would then be cached under a key that looks valid.
        if: ${{ !cancelled() && steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # The whole suite, so a new spec cannot be silently left out of CI.
      # silent-fix.spec.ts needs a real ANTHROPIC_API_KEY, which a fork PR cannot
      # have; it is `test.describe.skip` in the file itself and reports as
      # skipped. Everything that does run here runs on a fork unchanged.
      - name: Run Playwright specs
        working-directory: frontend
        run: npx playwright test

      # The HTML report already embeds the screenshots and traces, deduplicated,
      # so test-results/ would only triple the artifact. `cancelled()` matters
      # because a hung e2e job is exactly when the report is worth having.
      - name: Upload Playwright report
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 3
          if-no-files-found: ignore

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # cache-apt-pkgs never refreshes the package lists on GitHub runners, and
      # the image's lists go stale: on a cache miss apt then 404s on superseded
      # debs, the action carries on, and caches an empty result under the final
      # key. Refreshing first costs a few seconds and keeps the cache honest.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Install system deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev gcc
          version: 1.0

      # The action above caches whatever it managed to install, including nothing.
      # Fail here, at the cause, rather than later at the first cgo package.
      - name: Check GTK3 headers are present
        run: pkg-config --exists --print-errors gtk+-3.0 webkit2gtk-4.1

      - name: Install Wails v3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Linux binary
        run: |
          export PATH=$PATH:$HOME/go/bin
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -tags production,gtk3 -trimpath -ldflags="-w -s -X main.AppVersion=${VERSION}" -o bin/KeyLint .

      # The gtk3 tag is the only thing keeping Linux off GTK4 + WebKitGTK 6.0,
      # which aborts at start on stock Ubuntu 23.10+. Fail if it ever slips.
      - name: Check the Linux binary links GTK3
        run: |
          needed=$(readelf -d bin/KeyLint | grep NEEDED)
          case "$needed" in *libgtk-3.so*) ;; *) bad=1;; esac
          case "$needed" in *libwebkit2gtk-4.1.so*) ;; *) bad=1;; esac
          if [ -n "${bad:-}" ]; then
            echo "$needed"
            echo "::error::bin/KeyLint does not link GTK3 / WebKit2GTK 4.1 - was -tags gtk3 dropped?"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: KeyLint-linux-amd64
          path: bin/KeyLint
          retention-days: 3

  build-windows:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # cache-apt-pkgs never refreshes the package lists on GitHub runners, and
      # the image's lists go stale: on a cache miss apt then 404s on superseded
      # debs, the action carries on, and caches an empty result under the final
      # key. Refreshing first costs a few seconds and keeps the cache honest.
      - name: Refresh apt package lists
        run: sudo apt-get update

      - name: Install system deps
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev gcc gcc-mingw-w64
          version: 1.0

      # The action above caches whatever it managed to install, including nothing.
      # Fail here, at the cause, rather than later at the first cgo package.
      - name: Check GTK3 headers are present
        run: pkg-config --exists --print-errors gtk+-3.0 webkit2gtk-4.1

      - name: Install Wails v3 CLI
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.25

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate Windows resource file
        run: |
          export PATH=$PATH:$HOME/go/bin
          wails3 generate syso \
            -arch amd64 \
            -icon build/windows/icon.ico \
            -manifest build/windows/wails.exe.manifest \
            -info build/windows/info.json \
            -out wails_windows_amd64.syso

      - name: Build Windows binary
        run: |
          export PATH=$PATH:$HOME/go/bin
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-w64-mingw32-gcc \
            go build -tags production -trimpath \
            -ldflags="-w -s -H windowsgui -X main.AppVersion=${VERSION}" \
            -o bin/KeyLint.exe .

      - name: Install NSIS
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: nsis
          version: 1.0

      # The bootstrapper is bundled into the installer end users run, so it is
      # fetched through a script that refuses anything not signed by Microsoft.
      # See .claude/docs/versioning.md.
      - name: Install signature tooling
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: osslsigncode
          version: 1.0

      - name: Download and verify the WebView2 bootstrapper
        run: ./scripts/fetch-webview2.sh

      - name: Build NSIS installer
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          makensis -DARG_WAILS_AMD64_BINARY=../../../bin/KeyLint.exe \
            -DINFO_PRODUCTVERSION="${VERSION#v}" \
            build/windows/nsis/project.nsi

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: KeyLint-windows-amd64
          path: bin/KeyLint.exe
          retention-days: 3

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: KeyLint-windows-amd64-setup
          path: bin/KeyLint-amd64-installer.exe
          retention-days: 3
