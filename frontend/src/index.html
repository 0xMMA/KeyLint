<!doctype html>
<html lang="en" class="app-dark">
<!--
  .app-dark marks the theme, and it belongs on <html>, not <body>. KeyLint's
  tokens live on :root (theme.css), several of them aliases of others
  (--kl-hover: var(--kl-raised)), and an alias resolves on the element that
  declares it. A theme class below the root would leave the aliases on the
  old values; that is how PrimeNG's select panels, tab bars and disabled
  fields stayed light (#28). Only the dark theme exists for now (#24); the
  light one (#25) keys off this class. ShellComponent.applyTheme() keeps it.
-->
<head>
  <meta charset="utf-8">
  <title>KeyLint</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
